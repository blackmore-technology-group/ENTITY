[build]
incremental = false

[term]
color = "always"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "none"
debug = 1

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "force-frame-pointers=yes"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "force-frame-pointers=yes"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "force-frame-pointers=yes"]
