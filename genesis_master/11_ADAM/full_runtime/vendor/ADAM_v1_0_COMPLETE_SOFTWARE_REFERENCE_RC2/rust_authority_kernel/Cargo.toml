[package]
name = "adam-v043-authority-kernel"
version = "0.43.0-dev2"
edition = "2021"
description = "Source-audited isolated ADAM authority kernel (requires external Rust compilation)"
license = "Proprietary"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zeroize = "1.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
