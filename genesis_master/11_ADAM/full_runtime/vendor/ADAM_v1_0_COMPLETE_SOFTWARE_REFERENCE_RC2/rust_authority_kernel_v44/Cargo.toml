[package]
name = "adam-v044-atomic-physics-kernel"
version = "0.44.0-dev2"
edition = "2021"
description = "Source-audited ADAM bond, hyperbond and reaction authority kernel (external Rust compilation required)"
license = "Proprietary"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zeroize = "1.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
