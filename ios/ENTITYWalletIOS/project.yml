name: ENTITYWalletIOS
options:
  bundleIdPrefix: technology.blackmore
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "3.4.3"

targets:
  ENTITYWalletIOS:
    type: application
    platform: iOS
    sources:
      - path: ENTITYWalletIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.blackmore.entitywallet
        PRODUCT_NAME: ENTITYWalletIOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ENTITY Wallet
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

schemes:
  ENTITYWalletIOS:
    build:
      targets:
        ENTITYWalletIOS: all
    run:
      config: Debug
    archive:
      config: Release
