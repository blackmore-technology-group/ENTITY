name: Independent Node Program
on:
  pull_request:
    paths:
      - 'independent-node/**'
      - '.github/workflows/independent-node.yml'
  push:
    branches: [main]
    paths:
      - 'independent-node/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Independent Node tests
        run: python -m unittest discover -s independent-node/tests -v
      - name: CLI smoke test
        run: |
          python independent-node/node.py --help
          python independent-node/node.py init
          python independent-node/node.py status
