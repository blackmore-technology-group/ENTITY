name: ENTITY Wallet Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/42_ENTITY_Wallet/**"
      - "src/43_DCO_Factory/dco_production_pipeline.py"
      - "tools/entity_wallet_desktop.py"
      - "tools/build_entity_wallet_desktop.py"
      - ".github/workflows/entity-wallet-desktop.yml"

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pyinstaller cryptography
      - run: python tools/build_entity_wallet_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ENTITY-Wallet-${{ runner.os }}
          path: |
            dist/ENTITY-Wallet*
            dist/ENTITY-Wallet.app/**
