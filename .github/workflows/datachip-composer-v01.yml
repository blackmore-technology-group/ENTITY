name: ENTITY Universal DataChip Composer

on:
  push:
    branches:
      - feature/entity-wallet-datachip-composer-20261013
    paths:
      - "src/42_ENTITY_Wallet/datachip_graph.py"
      - "tools/datachip_workspace_ui.py"
      - "tools/entity_datachip_composer_preview.py"
      - "tests/test_datachip_graph.py"
      - ".github/workflows/datachip-composer-v01.yml"
  pull_request:
    paths:
      - "src/42_ENTITY_Wallet/datachip_graph.py"
      - "tools/datachip_workspace_ui.py"
      - "tools/entity_datachip_composer_preview.py"
      - "tests/test_datachip_graph.py"
      - ".github/workflows/datachip-composer-v01.yml"

permissions:
  contents: read

jobs:
  graph-compiler:
    name: typed-graph (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Syntax-check bounded graph engine and visual workspace
        run: python -m py_compile src/42_ENTITY_Wallet/datachip_graph.py tools/datachip_workspace_ui.py tools/entity_datachip_composer_preview.py
      - name: Adversarial graph, rights and wallet-scope tests
        run: python -B -m unittest discover -s tests -p "test_datachip_graph.py" -v
