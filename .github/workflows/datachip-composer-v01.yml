name: ENTITY Universal DataChip Composer

on:
  push:
    branches:
      - feature/entity-wallet-datachip-composer-20261013
    paths:
      - "src/42_ENTITY_Wallet/datachip_graph.py"
      - "tools/datachip_workspace_ui.py"
      - "tools/entity_datachip_composer_preview.py"
      - "tests/test_datachip_graph.py"
      - ".github/workflows/datachip-composer-v01.yml"
  pull_request:
    paths:
      - "src/42_ENTITY_Wallet/datachip_graph.py"
      - "tools/datachip_workspace_ui.py"
      - "tools/entity_datachip_composer_preview.py"
      - "tests/test_datachip_graph.py"
      - ".github/workflows/datachip-composer-v01.yml"

permissions:
  contents: read

jobs:
  graph-compiler:
    name: typed-graph (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Syntax-check bounded graph engine and visual workspace
        run: python -m py_compile src/42_ENTITY_Wallet/datachip_graph.py tools/datachip_workspace_ui.py tools/entity_datachip_composer_preview.py
      - name: Adversarial graph, rights and wallet-scope tests
        run: python -B -m unittest discover -s tests -p "test_datachip_graph.py" -v

  headless-composer-ui:
    name: visual-canvas-smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install only Qt Essentials for isolated UI test
        run: python -m pip install PySide6-Essentials==6.8.3
      - name: Exercise actual visual canvas and compile a five-chip sample
        run: python tools/entity_datachip_composer_preview.py --self-test
      - name: Capture genuine headless Qt canvas preview
        run: python tools/entity_datachip_composer_preview.py --render-preview composer-preview.png
      - name: Install preview packager and EDCF verifier dependencies
        run: python -m pip install pyinstaller cryptography
      - name: Build isolated Windows Composer preview EXE
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name ENTITY-Composer-Preview --hidden-import uuid --hidden-import dataclasses --hidden-import math --hidden-import json --hidden-import pathlib --hidden-import tempfile --hidden-import hashlib --hidden-import re --add-data "src/42_ENTITY_Wallet/datachip_graph.py;src/42_ENTITY_Wallet" --add-data "sdk/datachip;sdk/datachip" tools/entity_datachip_composer_preview.py
      - name: Confirm Windows EXE exists
        run: if (!(Test-Path "dist/ENTITY-Composer-Preview/ENTITY-Composer-Preview.exe")) { throw "Preview executable missing" }
      - name: Run the actual frozen Windows preview in sandboxed headless mode
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM="offscreen"
          & "./dist/ENTITY-Composer-Preview/ENTITY-Composer-Preview.exe" --render-preview "composer-packaged-smoke.png"
          if ($LASTEXITCODE -ne 0) { throw "Frozen preview failed to launch" }
          if (!(Test-Path "composer-packaged-smoke.png")) { throw "No frozen GUI evidence was produced" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: ENTITY-Composer-Preview-Windows
          path: dist/ENTITY-Composer-Preview/**
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: ENTITY-DataChip-Composer-Canvas
          path: composer-preview.png
          if-no-files-found: error
