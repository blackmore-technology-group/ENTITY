name: ENTITY DataChip independent Rust verification

on:
  pull_request:
    paths:
      - "native/datachip_core/**"
      - ".github/workflows/datachip-native-rust.yml"
  push:
    branches: [main]
    paths:
      - "native/datachip_core/**"
      - ".github/workflows/datachip-native-rust.yml"

permissions:
  contents: read

jobs:
  native-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build independent Rust DataChip verifier
        run: cargo build --release --locked --manifest-path native/datachip_core/Cargo.toml
      - name: Run Rust tests
        run: cargo test --locked --manifest-path native/datachip_core/Cargo.toml
      - name: Typecheck Swift host adapter
        if: matrix.os == 'macos-latest'
        run: swiftc -typecheck native/datachip_core/bindings/swift/DataChipNativeVerifier.swift
      - name: Install Python oracle test dependency
        run: python -m pip install "cryptography>=50.0.1,<51"
      - name: Cross-language formula and Ed25519 grant parity
        run: python -B -m unittest discover -s native/datachip_core/tests -p "test_native_*.py" -v
