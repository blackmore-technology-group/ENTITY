name: ENTITY public conformance smoke

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install reference dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate published source set
        run: |
          test -f src/15_Operations/backups/canonical_portable_state.py
          test -f src/04_Entity_Registry/credentials/canonical_credentials.py
          test -f src/22_Sovereign_Domain/recovery/canonical_domain_recovery.py
          test -f sdk/principal_binding/ENTITY_PRINCIPAL_BINDING_v1.schema.json

      - name: Compile published Python
        run: python -m compileall -q src sdk protocol

      - name: Run public contract and repository-safety tests
        run: python -m unittest discover -s tests -v
