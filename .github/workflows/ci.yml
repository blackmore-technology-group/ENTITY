name: ENTITY public conformance smoke

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reference dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile published Python
        run: python -m compileall -q src sdk protocol

      - name: Run public contract and repository-safety tests
        run: python -m unittest discover -s tests -v
