name: ENTITY execution-rights engineering qualification
on:
  pull_request:
    paths:
      - "sdk/datachip/execution_rights.py"
      - "sdk/datachip/execution_host.py"
      - "tests/test_entity_datachip_execute_authority.py"
      - ".github/workflows/entity-execution-rights-v01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execution-authorization:
    name: Execute rights / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned signature verifier only
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Compile frozen-compatible EDCF and execute scope modules
        run: python -B -m py_compile sdk/datachip/rights.py sdk/datachip/authority_bridge.py sdk/datachip/execution_rights.py sdk/datachip/execution_host.py
      - name: Genuine RightsPassportRegistry signed execute rights and bounded in-memory host
        run: python -B -m unittest discover -s tests -p "test_entity_datachip_execute_authority.py" -v
      - name: Existing signed EXPORT rights must remain separate
        run: python -B -m unittest discover -s tests -p "test_entity_datachip_authority_bridge.py" -v
      - name: Existing EDCF signed export grants must remain separate
        run: python -B -m unittest discover -s tests -p "test_entity_datachip_formula_rights.py" -v
